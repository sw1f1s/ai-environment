[package]
name = "aienv"
version = "0.1.0"
edition = "2021"
description = "Project context and verified task tools for coding agents"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

# Freshness checks hash compiler binaries as well as source files.
[profile.dev.package.sha2]
opt-level = 3
